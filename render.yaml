# Render configuration for JobPilot monorepo - using npm workspaces
services:
  - type: web
    name: jobpilot-web
    env: node
    buildCommand: npm install && echo "Node version: $(node -v)" && echo "Installed workspace packages:" && npx ls workspace --parseable && npm run build --workspace=apps/web
    startCommand: npm run start --workspace=apps/web
    staticPublishPath: .next

  - type: web
    name: jobpilot-api
    env: node
    buildCommand: npm install && echo "Node version: $(node -v)" && echo "Installed workspace packages:" && npx ls workspace --parseable && npm run build --workspace=apps/api
    startCommand: npm run start --workspace=apps/api