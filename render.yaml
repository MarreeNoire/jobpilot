services:
  # ---------------------------------------------------
  # 1. API Backend Service (Express + Prisma)
  # ---------------------------------------------------
  - type: web
    name: jobpilot-api
    env: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npx prisma db push --schema=packages/database/prisma/schema.prisma && npm run build
    startCommand: npm run start --workspace=apps/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: jobpilot-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: jobpilot-db
          property: connectionString
      - key: FRONTEND_URL
        fromService:
          type: web
          name: jobpilot-web
          property: url
      - key: AUTH_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true

  # ---------------------------------------------------
  # 2. Frontend Web Service (Next.js)
  # ---------------------------------------------------
  - type: web
    name: jobpilot-web
    env: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm run start --workspace=apps/web
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: jobpilot-api
          property: url
      - key: NEXT_PUBLIC_APP_URL
        fromService:
          type: web
          name: jobpilot-web
          property: url

databases:
  # ---------------------------------------------------
  # 3. PostgreSQL Database Service
  # ---------------------------------------------------
  - name: jobpilot-db
    databaseName: jobpilot
    user: jobpilot
    plan: free
    region: frankfurt
