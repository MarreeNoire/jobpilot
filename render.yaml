# JobPilot - Deploiement Render (blueprint)
# Base de donnees : Supabase PostgreSQL (deja utilisee par le projet, voir .env)
services:
  # API Express (apps/api)
  - type: web
    name: jobpilot-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://jobpilot-web.onrender.com
      - key: DATABASE_URL
        sync: false # a renseigner dans le tableau de bord Render (Supabase, pooler 6543)
      - key: DIRECT_URL
        sync: false # a renseigner dans le tableau de bord Render (Supabase, port 5432)
      - key: AUTH_SECRET
        sync: false # a renseigner dans le tableau de bord Render
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false

  # Frontend Next.js (apps/web)
  - type: web
    name: jobpilot-web
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build --workspace=apps/web
    startCommand: cd apps/web && npx next start -p $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://jobpilot-api.onrender.com